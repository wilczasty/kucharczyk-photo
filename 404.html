<!doctype html>
<!-- SZABLON strony „nie znaleziono” – wypełnia go build/build.mjs. Style są w środku pliku,
     bo ta strona może się otworzyć pod dowolnym adresem (względne ścieżki do css/ by nie działały). -->
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nie ma takiej strony · Ewelina Kucharczyk Fotografia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23a47551'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23faf6ef' text-anchor='middle'%3EEK%3C/text%3E%3C/svg%3E">
  <style>
    :root { --paper: #faf6ef; --linen: #f1e9dc; --wood: #a8743f; --wood-dark: #7d5536; --bark: #3f3228; --muted: #6f604f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1.25rem;
      background: var(--paper); color: var(--bark); text-align: center;
      font: 300 1.05rem/1.7 "Jost", system-ui, sans-serif;
    }
    main { max-width: 34rem; }
    .script { font: 500 2rem/1.2 "Caveat", "Segoe Script", cursive; color: var(--wood); margin: 0; }
    h1 { font: 500 clamp(2.2rem, 7vw, 3.2rem)/1.15 "Cormorant Garamond", Georgia, serif; margin: .2em 0 .5em; }
    p { color: var(--muted); margin: 0 0 2rem; }
    a.btn {
      display: inline-block; padding: .85rem 1.9rem; border-radius: 4px; text-decoration: none;
      font: 500 .8rem/1 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase;
      background: var(--wood-dark); color: var(--paper);
    }
    a.btn:hover { background: var(--bark); }
    a:focus-visible { outline: 2px solid var(--wood-dark); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="script">ups…</p>
    <h1>Nie ma takiej strony</h1>
    <p>Ten adres nie istnieje albo strona została przeniesiona. Zapraszam na stronę główną – tam znajdziesz portfolio, ofertę i wolne terminy.</p>
    <a class="btn" href="{{strona.adres_glowny}}">Wróć na stronę główną</a>
  </main>
</body>
</html>
