# Buduje stronę (build/build.mjs) i publikuje ją na GitHub Pages po każdej zmianie w gałęzi main –
# także po zapisie w panelu Pages CMS. Postęp: zakładka „Actions” w repozytorium.
name: Publikacja strony

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# kolejne zapisy w krótkim czasie: starsza, jeszcze trwająca publikacja zostaje anulowana
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # pełna historia – kolejność zdjęć wg daty dodania
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
