# Buduje stronę (build/build.mjs) i publikuje ją na GitHub Pages po każdej zmianie w gałęzi main –
# także po zapisie w panelu Pages CMS. Postęp: zakładka „Actions” w repozytorium.
name: Publikacja strony

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# kolejne zapisy w krótkim czasie czekają w kolejce – trwająca publikacja nie jest przerywana w połowie
# (tak zaleca GitHub dla Pages; przerwany deploy potrafi zostawić stronę w starej wersji)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # pełna historia – kolejność zdjęć wg daty dodania
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ostrzeżenia (np. pominięte uszkodzone zdjęcie) widać w podsumowaniu przebiegu w zakładce „Actions”
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
